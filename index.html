<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what makes `env(safe-area-inset-*)` non-zero. The
      bottom nav uses it to clear the home indicator; without this attribute the
      insets read 0 and the nav sits under it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Desktop shows the page ground; a phone runs full-bleed on the app's own. -->
    <meta name="theme-color" content="#E8E5DE" media="(min-width: 501px)" />
    <meta name="theme-color" content="#F4F2ED" media="(max-width: 500px)" />

    <!-- Added to the Home Screen, open without Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ATHLY IQ" />

    <title>ATHLY IQ — eat food you actually like</title>
    <meta
      name="description"
      content="ATHLY IQ builds an athlete's week of meals around what they love to eat, what they won't touch, and when they train."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores SVG for the Home Screen icon; without this PNG it renders a
         screenshot of the page instead. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Archivo, with the width axis the design leans on (font-stretch: 113–125%).
      Loaded from Google Fonts because that is the exact resource the design was
      drawn against; self-hosting is a deliberate later step, not a free swap.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ATHLY IQ — eat food you actually like" />
    <meta
      property="og:description"
      content="Tell ATHLY IQ what you love, what you won't touch, and when you train. It handles the rest — no spreadsheets."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>ATHLY IQ needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
