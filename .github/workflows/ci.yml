name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `build:local`, not `build`. A production build refuses to run without
      # Supabase credentials, deliberately — a bundle with none looks like a
      # working product and saves nothing. CI checks that the code compiles, and
      # has no business holding deploy credentials to do it.
      - name: Build
        run: npm run build:local

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  visual:
    # The design is the asset this project was built to preserve, so the pixel
    # comparison that proved the port is a gate, not a one-off. Separate job: it
    # needs a browser, and the rest of CI should not wait for that download.
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The local-only app is the one the twenty baselines are of: with no
      # backend configured there is no account gate, and the walkthrough is the
      # one the design shipped.
      - name: Build
        run: npm run build:local

      - name: Compare against baseline
        run: npm run test:visual

      # The account screens exist only with a backend configured, so this builds
      # a second time against a host that does not resolve. Every screen it
      # photographs renders before any request is made.
      - name: Compare account screens against baseline
        run: npm run test:visual:auth

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            tools/visual/diffs
            tools/visual/diffs-auth
            tools/visual/.capture
            tools/visual/.capture-auth
          retention-days: 7
