name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        # Baselines have to be produced by the pinned image, because that is the
        # only renderer whose output the gate compares against. Anyone with
        # Docker can do it locally with `npm run test:visual:update:docker`;
        # this is the same thing for anyone who cannot, and it is deliberately
        # manual — nothing on a normal push can rewrite what the gate measures
        # against, or the gate would agree with itself forever.
        description: 'Regenerate the visual baselines in the pinned image and commit them'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `build:local`, not `build`. A production build refuses to run without
      # Supabase credentials, deliberately — a bundle with none looks like a
      # working product and saves nothing. CI checks that the code compiles, and
      # has no business holding deploy credentials to do it.
      - name: Build
        run: npm run build:local

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  visual:
    # The design is the asset this project was built to preserve, so the pixel
    # comparison that proved the port is a gate, not a one-off. Separate job: it
    # needs a browser, and the rest of CI should not wait for that download.
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Write access is needed only by the manual `update_baselines` path, which
    # is the one step in this repository that commits from CI.
    permissions:
      contents: write

    # Pinned, because a pixel comparison is a comparison of two renderings and
    # the renderer is part of the input.
    #
    # This job used to run on the bare runner with `npx playwright install`,
    # which meant the baselines and CI were free to disagree about the Chromium
    # build, the freetype version and the system fonts — and they did. Every one
    # of the twenty screens differed, including ones nobody had touched, by
    # between 0.25% and 6% of their pixels: not a regression, just two machines
    # drawing the same text slightly differently.
    #
    # The tag must match the `playwright` version in package.json. Regenerate
    # baselines in this exact image — `npm run test:visual:update:docker` — or
    # they will disagree with CI again.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The local-only app is the one the twenty baselines are of: with no
      # backend configured there is no account gate, and the walkthrough is the
      # one the design shipped.
      - name: Build
        run: npm run build:local

      - name: Compare against baseline
        if: ${{ !inputs.update_baselines }}
        run: npm run test:visual

      # The account screens exist only with a backend configured, so this builds
      # a second time against a host that does not resolve. Every screen it
      # photographs renders before any request is made.
      - name: Compare account screens against baseline
        if: ${{ !inputs.update_baselines }}
        run: npm run test:visual:auth

      - name: Regenerate baselines
        if: ${{ inputs.update_baselines }}
        run: |
          npm run test:visual:update
          npm run test:visual:auth:update

      - name: Commit baselines
        if: ${{ inputs.update_baselines }}
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/visual/baseline tools/visual/baseline-auth
          if git diff --cached --quiet; then
            echo 'Baselines already match this image; nothing to commit.'
            exit 0
          fi
          git commit -m 'Regenerate visual baselines in the pinned image' \
                     -m 'Captured by the CI container so the gate and the baselines agree on a renderer. Content unchanged; this is a re-rasterisation.'
          git push origin HEAD:'${{ github.ref_name }}'

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            tools/visual/diffs
            tools/visual/diffs-auth
            tools/visual/.capture
            tools/visual/.capture-auth
          # `.capture` is a dot-directory, so the default excluded the very
          # thing worth having: the screens as this pinned image draws them.
          # Only the diff images were being uploaded, which show where two
          # renderings disagree but cannot be used to fix the disagreement.
          include-hidden-files: true
          retention-days: 7
